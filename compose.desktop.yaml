# WindowsのDocker Desktop専用。本番Linuxではcompose.yamlのファイル型secretsを使う。
services:
  prepare-secrets:
    image: node:24.22.2-bookworm-slim
    command: [node, /prepare.mjs]
    secrets: [db_admin_password, db_app_password, db_migrate_password, db_backup_password, db_maintenance_password, auth_secret]
    volumes:
      - ./scripts/prepare-desktop-secrets.mjs:/prepare.mjs:ro
      - desktop_secrets:/prepared
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
  db:
    secrets: !reset []
    depends_on: { prepare-secrets: { condition: service_completed_successfully } }
    volumes:
      - type: volume
        source: desktop_secrets
        target: /run/secrets
        read_only: true
        volume: { subpath: db }
  migrate:
    secrets: !reset []
    volumes:
      - type: volume
        source: desktop_secrets
        target: /run/secrets
        read_only: true
        volume: { subpath: migrate }
  api:
    secrets: !reset []
    volumes:
      - type: volume
        source: desktop_secrets
        target: /run/secrets
        read_only: true
        volume: { subpath: api }
  maintenance:
    secrets: !reset []
    volumes:
      - type: volume
        source: desktop_secrets
        target: /run/secrets
        read_only: true
        volume: { subpath: maintenance }
volumes:
  desktop_secrets:

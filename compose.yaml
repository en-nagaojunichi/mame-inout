name: mame-inout-dev

x-api-environment: &api-environment
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
  DB_HOST: db
  DB_NAME: mame
  DB_USER: mame_app
  DB_PASSWORD_FILE: /run/secrets/db_app_password
  AUTH_SECRET_FILE: /run/secrets/auth_secret

services:
  db:
    image: postgres:18.6-bookworm
    user: "1000:1000"
    environment:
      POSTGRES_DB: mame
      POSTGRES_USER: mame_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets: [db_admin_password, db_app_password, db_migrate_password]
    volumes:
      - db_data:/var/lib/postgresql
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U mame_owner -d mame"]
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  migrate:
    image: ${API_IMAGE:-mame-inout-api:dev}
    pull_policy: never
    environment:
      <<: *api-environment
      DB_USER: mame_migrate
      DB_PASSWORD_FILE: /run/secrets/db_migrate_password
    secrets: [db_migrate_password]
    command: [node, dist/migrate.js]
    networks: [database]
    depends_on: { db: { condition: service_healthy } }
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  api:
    image: ${API_IMAGE:-mame-inout-api:dev}
    build: { context: ., dockerfile: infra/Dockerfile, target: api }
    environment: *api-environment
    secrets: [db_app_password, auth_secret]
    networks: [edge, database]
    depends_on: { migrate: { condition: service_completed_successfully } }
    read_only: true
    tmpfs: ["/tmp:uid=1000,gid=1000,mode=0700"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  web:
    image: ${WEB_IMAGE:-mame-inout-web:dev}
    build: { context: ., dockerfile: infra/Dockerfile, target: web }
    networks: [edge]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  proxy:
    image: caddy:2.11.9-alpine
    ports: ["127.0.0.1:${HTTP_PORT:-8080}:8080"]
    volumes: ["./infra/Caddyfile:/etc/caddy/Caddyfile:ro"]
    networks: [edge]
    depends_on: { api: { condition: service_healthy }, web: { condition: service_started } }
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

networks:
  edge:
  database:
    internal: true
volumes:
  db_data:
secrets:
  db_admin_password: { file: "${SECRETS_DIR:-./secrets}/db_admin_password" }
  db_app_password: { file: "${SECRETS_DIR:-./secrets}/db_app_password" }
  db_migrate_password: { file: "${SECRETS_DIR:-./secrets}/db_migrate_password" }
  auth_secret: { file: "${SECRETS_DIR:-./secrets}/auth_secret" }
